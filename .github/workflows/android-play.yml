name: Build for Google Play (AAB)

# Makes the signed Android App Bundle (.aab) you upload to Google Play Console.
# Run it by hand: Actions → "Build for Google Play (AAB)" → Run workflow.
# The .aab is a private Actions artifact (not a public Release); download it from
# the run's summary page and upload it in Play Console.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_BASE64    your upload keystore file, base64-encoded
#   UPLOAD_KEYSTORE_PASSWORD  keystore password
#   UPLOAD_KEY_ALIAS          key alias (e.g. "upload")
#   UPLOAD_KEY_PASSWORD       key password
# Optional: GOOGLE_MAPS_API_KEY (a Maps key restricted to this app).

on:
  workflow_dispatch:

concurrency:
  group: android-play
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check signing secrets
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing UPLOAD_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing UPLOAD_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing UPLOAD_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Play version codes start at 1001 so they never clash with sideload build numbers.
      - name: Version code
        run: echo "BUILD_NUMBER=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          APP_CHANNEL: play
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Check the Play build has no self-update permission
        run: |
          if grep -q 'REQUEST_INSTALL_PACKAGES"' android/app/src/main/AndroidManifest.xml \
             && ! grep -q 'REQUEST_INSTALL_PACKAGES" tools:node="remove"' android/app/src/main/AndroidManifest.xml; then
            echo "::error::REQUEST_INSTALL_PACKAGES is still in the manifest"; exit 1
          fi

      - name: Restore the upload keystore
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build release bundle
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NODE_ENV: production
          APP_CHANNEL: play
          SWAP_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          SWAP_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          SWAP_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SWAP_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Check it is signed with the upload key (not the debug key)
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | tee cert.txt
          if grep -qi '5E:8F:16:06:2E:A3:CD:2C:4A:0D:54:78:76:BA:A6:F3:8C:AB:F6:25' cert.txt; then
            echo "::error::The bundle is signed with the public debug key. Check the UPLOAD_* secrets."; exit 1
          fi

      # Google Play requires native libraries aligned for 16 KB memory pages.
      - name: Check 16 KB page alignment
        run: |
          mkdir -p aab && unzip -q -o android/app/build/outputs/bundle/release/app-release.aab 'base/lib/*' -d aab || true
          bad=0
          for so in $(find aab/base/lib -name '*.so' \( -path '*arm64-v8a*' -o -path '*x86_64*' \)); do
            for a in $(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}'); do
              if [ $((a)) -lt 16384 ]; then echo "::warning::$so has LOAD alignment $a (needs 0x4000)"; bad=1; fi
            done
          done
          [ $bad -eq 0 ] && echo "All 64-bit native libraries are 16 KB aligned."
          rm -rf aab

      - name: Rename
        id: out
        run: |
          V=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/bundle/release/app-release.aab "swap-play-${V}-${BUILD_NUMBER}.aab"
          echo "file=swap-play-${V}-${BUILD_NUMBER}.aab" >> "$GITHUB_OUTPUT"
          echo "### Swap V ${V} for Google Play (version code ${BUILD_NUMBER})" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the artifact below and upload the .aab in Play Console." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bundle (private Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: swap-play-aab-${{ env.BUILD_NUMBER }}
          path: ${{ steps.out.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

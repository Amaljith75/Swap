name: Checks

# Runs on every push and pull request (any branch). Builds nothing to install;
# it just catches mistakes before an APK or Play build is made.
on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Typecheck and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle the Android JavaScript
        run: npx expo export --platform android --output-dir /tmp/export
        env:
          CI: 1

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and tests
        shell: bash  # with pipefail, so a failing test fails the job
        run: |
          createdb swaptest
          files="-f supabase/tests/supabase_stubs.sql"
          for m in supabase/migrations/0*.sql; do
            case "$m" in *_schedules*.sql) continue;; esac   # pg_cron jobs: Supabase only
            files="$files -f $m"
          done
          psql -X -q -v ON_ERROR_STOP=1 -d swaptest -c 'create extension pgcrypto' $files \
            -f supabase/tests/trade_flow_test.sql -f supabase/tests/play_release_test.sql 2>&1 | grep -v 'NOTICE:  ok'

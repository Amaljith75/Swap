name: Build Android APK

# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME is already set).
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NODE_ENV: production
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        id: apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk swap-${{ github.run_number }}.apk
          echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: swap-apk-${{ github.run_number }}
          path: swap-${{ github.run_number }}.apk
          if-no-files-found: error

      # A Release gives a direct .apk download link, easier on a phone than the zipped artifact.
      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Swap V ${{ steps.apk.outputs.version }}
          body: |
            Swap V ${{ steps.apk.outputs.version }} (build ${{ github.run_number }}).
            Install the .apk below on your Android phone. It installs over the previous version.
            Built from ${{ github.sha }}.
          files: swap-${{ github.run_number }}.apk

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Swap Password</title>
  <meta name="description" content="Choose a new password for your Swap account.">
  <link rel="stylesheet" href="style.css">
  <script src="site.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main>
  <header class="site"><span class="logo">⇄</span><a href="./">Swap</a></header>

  <h1>Choose a new password</h1>

  <form id="reset" class="hidden">
    <label for="pw">New password (at least 8 characters)</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
    <label for="pw2">Type it again</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
    <button type="submit" id="save">Save new password</button>
  </form>

  <p id="msg" class="msg" role="status" aria-live="polite">Checking your reset link…</p>

  <footer>
    <a href="./">Home</a> · <a href="privacy.html">Privacy Policy</a>
  </footer>
</main>
<script>
  const msg = document.getElementById('msg');
  const form = document.getElementById('reset');
  const say = (text, kind) => { msg.textContent = text; msg.className = 'msg ' + (kind || ''); };

  const hash = new URLSearchParams(location.hash.slice(1));
  const query = new URLSearchParams(location.search);
  const linkError = hash.get('error_description') || query.get('error_description');

  if (typeof supabase === 'undefined') {
    say('This page could not load. Check your connection and refresh.', 'error');
    throw new Error('supabase-js did not load');
  }
  // Reads the one-time sign-in from the email link; nothing is saved after this tab closes.
  const sb = supabase.createClient(SWAP.SUPABASE_URL, SWAP.SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true, flowType: 'implicit' },
  });

  const ready = () => { form.classList.remove('hidden'); say(''); document.getElementById('pw').focus(); };

  if (linkError) {
    say('This link has expired or was already used. In the app, tap "Forgot password?" to get a new one.', 'error');
  } else {
    sb.auth.onAuthStateChange((event, session) => {
      if (session && (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN')) ready();
    });
    setTimeout(async () => {
      const { data } = await sb.auth.getSession();
      if (data.session) ready();
      else if (form.classList.contains('hidden')) {
        say('Open this page from the reset link in your email. If the link is old, ask for a new one in the app.', 'error');
      }
    }, 1500);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    if (pw.length < 8) return say('Use at least 8 characters.', 'error');
    if (pw !== document.getElementById('pw2').value) return say('The two passwords don’t match.', 'error');
    const btn = document.getElementById('save');
    btn.disabled = true;
    say('Saving…');
    const { error } = await sb.auth.updateUser({ password: pw });
    btn.disabled = false;
    if (error) return say(error.message, 'error');
    await sb.auth.signOut();
    form.classList.add('hidden');
    history.replaceState(null, '', location.pathname);
    say('Password changed. Open Swap and sign in with your new password.', 'ok');
  });
</script>
</body>
</html>
